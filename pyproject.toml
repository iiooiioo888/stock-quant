[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-quant-platform"
version = "1.1.0"
description = "股票量化交易策略平台"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Stock Quant Team"}
]
keywords = ["stock", "quant", "trading", "backtest", "strategy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 生產依賴（與 requirements.txt 同步）
dependencies = [
    "akshare>=1.14.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "backtrader>=1.9.78.123,<2.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "schedule>=1.2.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "optuna>=3.0.0,<4.0.0",
    "joblib>=1.3.0,<2.0.0",
    "numpy>=1.24.0,<3.0.0",
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "websockets>=12.0,<13.0",
    "python-multipart>=0.0.6,<1.0.0",
    "apscheduler>=3.10.0,<4.0.0",
    "redis>=5.0.0,<6.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    "bcrypt>=4.1.0,<5.0.0",
    "celery>=5.3.0,<6.0.0",
    "prometheus-client>=0.19.0,<1.0.0",
    "orjson>=3.9,<4.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "numba>=0.59.0,<1.0.0",
    "pyarrow>=14.0.0,<21.0.0",
    "structlog>=24.0.0,<27.0.0",
    "opentelemetry-api>=1.20.0,<2.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "playwright>=1.40.0,<2.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
    "responses>=0.25.0,<1.0.0",
    "sentry-sdk>=2.0.0,<3.0.0",
    "hypothesis>=6.90.0,<7.0.0",
    "faker>=20.0.0,<21.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/stock-quant-platform"
Documentation = "https://github.com/your-org/stock-quant-platform/docs"
Repository = "https://github.com/your-org/stock-quant-platform"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
