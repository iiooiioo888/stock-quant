services:
  # ====== 應用服務 ======
  app:
    build: .
    container_name: stock-quant-app
    ports:
      - "${SQ_WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - SQ_DB_PATH=/app/data/stock.db
      - SQ_REDIS_URL=redis://:${SQ_REDIS_PASSWORD:-stockquant_redis_2024}@redis:6379/0
      - SQ_REDIS_ENABLED=true
      - SQ_JWT_SECRET=${SQ_JWT_SECRET:-}
      - SQ_CORS_ORIGINS=${SQ_CORS_ORIGINS:-http://localhost:8000}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ====== Redis 緩存 ======
  redis:
    image: redis:7-alpine
    container_name: stock-quant-redis
    # 不暴露端口到宿主机，仅内部访问
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${SQ_REDIS_PASSWORD:-stockquant_redis_2024}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SQ_REDIS_PASSWORD:-stockquant_redis_2024}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ====== Nginx 反向代理 ======
  nginx:
    image: nginx:alpine
    container_name: stock-quant-nginx
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  redis_data:
