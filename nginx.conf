# ============================================================
# Nginx 反向代理配置 — stock-quant
# 功能：反向代理、WebSocket、靜態文件、Gzip、限流
# ============================================================

# 限流區域：每 IP 每秒 10 個請求（API），突發 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=5r/s;

# ====== P3: API 緩存層（Nginx proxy_cache） ======
proxy_cache_path /tmp/nginx_api_cache
    levels=1:2
    keys_zone=api_cache:10m
    max_size=100m
    inactive=10m
    use_temp_path=off;

# 上游應用服務
upstream app_backend {
    server app:8000;
    keepalive 32;
}

# ====== HTTP (80) ======
server {
    listen 80;
    server_name _;

    # 客戶端最大上傳大小
    client_max_body_size 10m;

    # ----- Gzip 壓縮 -----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ----- 安全 Headers -----
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ----- API 反向代理 -----
    # P3: GET /api/* 使用 proxy_cache（5s TTL），寫操作直通
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;   # 回測可能耗時較長
        proxy_send_timeout 30s;

        # 僅 GET 請求使用緩存
        proxy_cache api_cache;
        proxy_cache_methods GET;
        proxy_cache_valid 200 5s;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_bypass $http_cache_control;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        # 添加緩存狀態 header（方便除錯）
        add_header X-Cache-Status $upstream_cache_status always;

        # 流式接口（SSE/NDJSON）需關閉緩衝和緩存
        proxy_buffering off;
        chunked_transfer_encoding on;

        proxy_pass http://app_backend;
    }

    # ----- WebSocket 代理 -----
    location /ws {
        limit_req zone=ws_limit burst=10 nodelay;
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # WebSocket 長連接
        proxy_send_timeout 3600s;
    }

    # ----- 靜態文件 -----
    location /static/ {
        proxy_pass http://app_backend;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # ----- 首頁 -----
    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ----- 健康檢查（Nginx 自身） -----
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

