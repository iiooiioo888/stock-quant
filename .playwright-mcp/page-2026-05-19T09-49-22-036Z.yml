- generic [ref=e2]: "/* ============================================================ stock-quant — CSS Variables & Theme System ============================================================ */ /* Dark theme (default) */ :root { --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-tertiary: #0f172a; --bg-hover: #334155; --border-color: #334155; --border-hover: #38bdf8; --text-primary: #f8fafc; --text-secondary: #e2e8f0; --text-muted: #94a3b8; --text-dim: #64748b; --accent: #38bdf8; --accent-hover: #7dd3fc; --accent-bg: rgba(56, 189, 248, 0.12); --green: #22c55e; --green-bg: rgba(34, 197, 94, 0.12); --red: #ef4444; --red-bg: rgba(239, 68, 68, 0.12); --yellow: #f59e0b; --purple: #a78bfa; --pink: #ec4899; --cyan: #06b6d4; --btn-primary-bg: #38bdf8; --btn-primary-color: #0f172a; --btn-secondary-bg: #334155; --btn-secondary-color: #e2e8f0; --btn-secondary-hover: #475569; --shadow: 0 2px 8px rgba(0, 0, 0, 0.3); --radius: 8px; --radius-sm: 5px; --radius-lg: 10px; --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace; --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; --toast-border: #38bdf8; --modal-bg: rgba(0, 0, 0, 0.6); --sidebar-w: 220px; --header-h: 48px; } /* Light theme */ [data-theme=\"light\"] { --bg-primary: #f1f5f9; --bg-secondary: #ffffff; --bg-tertiary: #f8fafc; --bg-hover: #e2e8f0; --border-color: #e2e8f0; --border-hover: #38bdf8; --text-primary: #0f172a; --text-secondary: #334155; --text-muted: #64748b; --text-dim: #94a3b8; --accent: #0284c7; --accent-hover: #0369a1; --accent-bg: rgba(2, 132, 199, 0.08); --green: #16a34a; --green-bg: rgba(22, 163, 74, 0.08); --red: #dc2626; --red-bg: rgba(220, 38, 38, 0.08); --btn-primary-bg: #0284c7; --btn-primary-color: #ffffff; --btn-secondary-bg: #e2e8f0; --btn-secondary-color: #334155; --btn-secondary-hover: #cbd5e1; --shadow: 0 2px 8px rgba(0, 0, 0, 0.06); --toast-border: #0284c7; --modal-bg: rgba(0, 0, 0, 0.35); } /* ============================================