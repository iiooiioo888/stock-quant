t-scrollbar-thumb { background: var(--border-color); border-radius: 3px; } .main::-webkit-scrollbar-thumb:hover { background: var(--text-dim); } /* ============================================================ Grid Cards ============================================================ */ .g { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; } .c { background: var(--bg-secondary); border-radius: var(--radius); padding: 14px; border: 1px solid var(--border-color); transition: border-color 0.2s; } .c:hover { border-color: var(--border-hover); } .c h3 { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; letter-spacing: .5px; } .c .v { font-size: 22px; font-weight: 700; color: var(--text-primary); } .c .v.gn { color: var(--green); } .c .v.rd { color: var(--red); } .c .v.bl { color: var(--accent); } .c .v.yl { color: var(--yellow); } /* ============================================================ Tables ============================================================ */ table { width: 100%; border-collapse: collapse; } th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 12px; } th { color: var(--text-muted); font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: .3px; position: sticky; top: 0; background: var(--bg-secondary); z-index: 1; } td.r { text-align: right; font-variant-numeric: tabular-nums; } .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; } /* ============================================================ Badges & Chips ============================================================ */ .b { display: inline-block; padding: 2px 5px; border-radius: 3px; font-size: 10px; font-weight: 600; } .b.u { background: var(--green-bg); color: var(--green); } .b.d { background: var(--red-bg); color: var(--red); } .b.f { background: rgba(148, 163, 184, .12); color: var(--text-muted); } .chip { display: i