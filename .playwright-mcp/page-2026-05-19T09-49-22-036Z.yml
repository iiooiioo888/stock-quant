nt-weight: 700; flex-shrink: 0; margin-top: 20px; } .pf-builder-step.mt-lg { margin-top: 16px; } .pf-step-content { flex: 1; min-width: 0; } .pf-step-content label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; } .pf-step-content input { width: 100%; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 10px; border-radius: var(--radius-sm); font-size: 12px; font-family: var(--font-mono); } .pf-step-content input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-bg); } .pf-hint { display: block; font-size: 10px; color: var(--text-dim); margin-top: 3px; } /* Method Grid */ .pf-method-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 8px; margin-top: 4px; } .pf-method-grid.pf-grid-2 { grid-template-columns: repeat(2, 1fr); } .pf-method-grid.pf-grid-3 { grid-template-columns: repeat(3, 1fr); } .pf-method-card { background: var(--bg-primary); border: 1.5px solid var(--border-color); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; gap: 2px; } .pf-method-card:hover { border-color: var(--text-dim); background: var(--bg-hover); } .pf-method-card.active { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 1px var(--accent-bg); } .pf-method-icon { font-size: 18px; line-height: 1; } .pf-method-name { font-size: 12px; font-weight: 600; color: var(--text-primary); margin-top: 2px; } .pf-method-desc { font-size: 10px; color: var(--text-dim); line-height: 1.3; } .pf-method-card.active .pf-method-desc { color: var(--text-muted); } /* Params Panel */ .pf-params-panel { margin-top: 14px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 12px 16px; animation: pf-slideDown 0.2s ease; } @keyframes pf-slideDown { from { opacity: 0; t