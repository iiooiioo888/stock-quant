idth: 1px; height: 14px; background: var(--border-color); } .hdr .st { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; } .theme-toggle { background: var(--btn-secondary-bg); border: 1px solid var(--border-color); color: var(--text-secondary); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; } .theme-toggle:hover { background: var(--bg-hover); border-color: var(--border-hover); transform: rotate(20deg); } /* ============================================================ App Layout: Sidebar + Main ============================================================ */ .app { display: flex; flex: 1; overflow: hidden; } /* ============================================================ Sidebar ============================================================ */ .sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; transition: width 0.25s ease, min-width 0.25s ease; } .sidebar-nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 0; } .sidebar-nav::-webkit-scrollbar { width: 4px; } .sidebar-nav::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; } .sidebar .nav-section { padding: 6px 12px 4px; font-size: 9px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; white-space: nowrap; overflow: hidden; } .sidebar .nav-section:first-child { margin-top: 0; } .sidebar button { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent; border: none; color: var(--text-muted); padding: 8px 16px; cursor: pointer; font-size: 12.5px; transition: all 0.15s; text-align: left; border-left: 3px solid transparent; position: relative; white-space: nowrap; } .sidebar button .nav-icon { font-size: 14px; 