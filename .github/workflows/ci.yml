name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black flake8 isort
      - run: black --check --diff src/ tests/ strategies/
      - run: isort --check-only --diff src/ tests/ strategies/
      - run: flake8 src/ tests/ strategies/ --max-line-length=120 --ignore=E501,W503,E203

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      - name: Run tests
        env:
          SQ_DB_PATH: /tmp/test_stock.db
          SQ_REDIS_ENABLED: "false"
          SQ_LOG_LEVEL: WARNING
          SQ_DEBUG: "true"
          SQ_DEMO_MODE: "true"
          SQ_LOCAL_FIRST_AUTO_FETCH: "false"
        run: |
          python -m pytest tests/ -x --tb=short -q --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --desc

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t stock-quant:test .
      - name: Verify container starts
        run: |
          docker run --rm -d --name sq-test -p 8000:8000 \
            -e SQ_DEMO_MODE=true \
            -e SQ_DEBUG=true \
            stock-quant:test
          sleep 10
          curl -sf http://localhost:8000/api/health || exit 1
          docker stop sq-test