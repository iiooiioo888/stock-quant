name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black flake8 isort
      - run: black --check --diff src/ tests/ strategies/
      - run: isort --check-only --diff src/ tests/ strategies/
      - run: flake8 src/ tests/ strategies/ --max-line-length=120 --ignore=E501,W503,E203

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      - name: Run tests
        env:
          SQ_DB_PATH: /tmp/test_stock.db
          SQ_REDIS_ENABLED: "false"
          SQ_LOG_LEVEL: WARNING
          SQ_DEBUG: "true"
          SQ_DEMO_MODE: "true"
          SQ_LOCAL_FIRST_AUTO_FETCH: "false"
        run: |
          python -m pytest tests/ -x --tb=short -q --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  ops-check:
    name: Ops Health Check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run SOP ops check (CI mode)
        env:
          SQ_DB_PATH: /tmp/ci_ops_stock.db
          SQ_REDIS_ENABLED: "false"
          SQ_LOG_LEVEL: WARNING
          SQ_DEBUG: "true"
          SQ_DEMO_MODE: "true"
          SQ_LOCAL_FIRST_AUTO_FETCH: "false"
        run: |
          python main.py ops check --ci --json > ops-report.json
          python -c "import json; d=json.load(open('ops-report.json')); print('verdict:', d.get('verdict_zh'), d.get('verdict'))"
      - name: Ops report summary
        if: always()
        run: python scripts/ci_ops_summary.py ops-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Comment ops report on PR (sticky)
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci_pr_ops_comment.py ops-report.json
      - name: Upload ops report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-health-report
          path: ops-report.json
          if-no-files-found: ignore

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --desc

  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, ops-check, security]
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.ops-check.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "❌ One or more required checks failed"
            exit 1
          fi
          echo "✅ All checks passed"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t stock-quant:test .
      - name: Verify container starts
        run: |
          docker run --rm -d --name sq-test -p 8000:8000 \
            -e SQ_DEMO_MODE=true \
            -e SQ_DEBUG=true \
            stock-quant:test
          sleep 12
          curl -sf http://localhost:8000/api/health || exit 1
          curl -sf http://localhost:8000/api/health/sop | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('sop',{}).get('verdict') in ('ok','attention','critical')"
          docker exec sq-test python main.py ops check --ci --json > docker-ops-report.json
          python -c "import json; d=json.load(open('docker-ops-report.json')); print('docker ops:', d.get('verdict_zh')); assert d.get('verdict')!='critical'"
          python scripts/ci_ops_summary.py docker-ops-report.json >> "$GITHUB_STEP_SUMMARY"
          docker stop sq-test
      - name: Upload docker ops report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-ops-health-report
          path: docker-ops-report.json
          if-no-files-found: ignore