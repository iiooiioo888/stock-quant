# stock-quant Docker Compose
#
# 默認啟動（應用 + Redis）：
#   cp .env.example .env && docker compose up -d
#   訪問 http://localhost:8000
#
# 可選 Nginx 反向代理（端口 80）：
#   docker compose --profile proxy up -d
#   訪問 http://localhost
#
# 僅本地 LRU 緩存、不啟 Redis：
#   SQ_REDIS_ENABLED=false docker compose up -d app
#
# 完整棧（含 Nginx）：
#   docker compose --profile proxy up -d

services:
  # ====== 應用服務 ======
  app:
    build: .
    container_name: stock-quant-app
    ports:
      - "${SQ_WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      SQ_DB_PATH: /app/data/stock.db
      SQ_LOG_DIR: /app/logs
      # Redis（與 redis 服務聯動；關閉則僅用容器內 LRU）
      SQ_REDIS_ENABLED: ${SQ_REDIS_ENABLED:-true}
      SQ_REDIS_URL: redis://:${SQ_REDIS_PASSWORD:-stockquant_redis_2024}@redis:6379/0
      SQ_REDIS_PASSWORD: ${SQ_REDIS_PASSWORD:-stockquant_redis_2024}
      # 安全
      SQ_JWT_SECRET: ${SQ_JWT_SECRET:-}
      SQ_CORS_ORIGINS: ${SQ_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      SQ_WS_AUTH_REQUIRED: ${SQ_WS_AUTH_REQUIRED:-true}
      # 計算結果緩存（回測/優化等；K 線更新後自動失效）
      SQ_CACHE_ENABLED: ${SQ_CACHE_ENABLED:-true}
      SQ_CACHE_BACKTEST_TTL: ${SQ_CACHE_BACKTEST_TTL:-3600}
      SQ_CACHE_OPTIMIZE_TTL: ${SQ_CACHE_OPTIMIZE_TTL:-7200}
      SQ_CACHE_PORTFOLIO_TTL: ${SQ_CACHE_PORTFOLIO_TTL:-3600}
      SQ_CACHE_WALKFORWARD_TTL: ${SQ_CACHE_WALKFORWARD_TTL:-7200}
      SQ_CACHE_HEATMAP_TTL: ${SQ_CACHE_HEATMAP_TTL:-3600}
      SQ_CACHE_MULTI_STRATEGY_TTL: ${SQ_CACHE_MULTI_STRATEGY_TTL:-3600}
      # 異步任務佇列與並行
      SQ_TASK_MAX_WORKERS: ${SQ_TASK_MAX_WORKERS:-0}
      SQ_TASK_PARALLEL_GRID: ${SQ_TASK_PARALLEL_GRID:-true}
      SQ_TASK_GRID_WORKERS: ${SQ_TASK_GRID_WORKERS:-0}
      SQ_OPTIMIZE_ALL_PARALLEL: ${SQ_OPTIMIZE_ALL_PARALLEL:-false}
      SQ_OPTIMIZE_ALL_WORKERS: ${SQ_OPTIMIZE_ALL_WORKERS:-2}
      SQ_TASK_PROGRESS_SAVE_INTERVAL_SEC: ${SQ_TASK_PROGRESS_SAVE_INTERVAL_SEC:-2.0}
      # 演示模式（生產請設 false）
      SQ_DEMO_MODE: ${SQ_DEMO_MODE:-false}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ====== Redis（計算緩存跨進程共享） ======
  redis:
    image: redis:7-alpine
    container_name: stock-quant-redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${SQ_REDIS_PASSWORD:-stockquant_redis_2024}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SQ_REDIS_PASSWORD:-stockquant_redis_2024}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ====== Nginx 反向代理（可選） ======
  nginx:
    image: nginx:alpine
    container_name: stock-quant-nginx
    profiles:
      - proxy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
