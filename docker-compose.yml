# stock-quant Docker Compose — P7 重構版
#
# 默認啟動（應用 + Redis）：
#   cp .env.example .env && docker compose up -d
#
# 完整棧（含 PostgreSQL + Nginx）：
#   docker compose --profile postgres --profile proxy up -d
#
# 含 Celery Worker：
#   docker compose --profile celery --profile postgres up -d
#
# 生產部署（全棧）：
#   docker compose --profile postgres --profile celery --profile proxy up -d

services:
  # ====== 應用服務 ======
  app:
    build: .
    container_name: stock-quant-app
    ports:
      - "${SQ_WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      SQ_DB_PATH: /app/data/stock.db
      SQ_LOG_DIR: /app/logs
      # Redis
      SQ_REDIS_ENABLED: ${SQ_REDIS_ENABLED:-true}
      SQ_REDIS_URL: redis://:${SQ_REDIS_PASSWORD:-stockquant_redis_2024}@redis:6379/0
      SQ_REDIS_PASSWORD: ${SQ_REDIS_PASSWORD:-stockquant_redis_2024}
      # PostgreSQL（可選，profile=postgres 時啟用）
      SQ_DATABASE_URL: ${SQ_DATABASE_URL:-}
      # 安全
      SQ_JWT_SECRET: ${SQ_JWT_SECRET:-}
      SQ_CORS_ORIGINS: ${SQ_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      SQ_WS_AUTH_REQUIRED: ${SQ_WS_AUTH_REQUIRED:-true}
      # 緩存
      SQ_CACHE_ENABLED: ${SQ_CACHE_ENABLED:-true}
      SQ_CACHE_BACKTEST_TTL: ${SQ_CACHE_BACKTEST_TTL:-3600}
      SQ_CACHE_OPTIMIZE_TTL: ${SQ_CACHE_OPTIMIZE_TTL:-7200}
      SQ_CACHE_PORTFOLIO_TTL: ${SQ_CACHE_PORTFOLIO_TTL:-3600}
      SQ_CACHE_WARMUP_ON_STARTUP: ${SQ_CACHE_WARMUP_ON_STARTUP:-false}
      # 任務
      SQ_TASK_MAX_WORKERS: ${SQ_TASK_MAX_WORKERS:-0}
      SQ_TASK_PARALLEL_GRID: ${SQ_TASK_PARALLEL_GRID:-true}
      SQ_CELERY_ENABLED: ${SQ_CELERY_ENABLED:-false}
      SQ_DEMO_MODE: ${SQ_DEMO_MODE:-false}
    depends_on:
      redis:
        condition: service_healthy
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ====== Redis ======
  redis:
    image: redis:7-alpine
    container_name: stock-quant-redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${SQ_REDIS_PASSWORD:-stockquant_redis_2024}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SQ_REDIS_PASSWORD:-stockquant_redis_2024}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ====== PostgreSQL（P6：多實例數據共享） ======
  postgres:
    image: postgres:16-alpine
    container_name: stock-quant-postgres
    profiles:
      - postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${SQ_PG_DB:-stockquant}
      POSTGRES_USER: ${SQ_PG_USER:-stockquant}
      POSTGRES_PASSWORD: ${SQ_PG_PASSWORD:-stockquant_pg_2024}
    ports:
      - "${SQ_PG_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQ_PG_USER:-stockquant}"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ====== Celery Worker ======
  celery-worker:
    build: .
    container_name: stock-quant-celery
    command: celery -A celery_worker worker --loglevel=info --concurrency=4
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      SQ_DB_PATH: /app/data/stock.db
      SQ_LOG_DIR: /app/logs
      SQ_REDIS_ENABLED: ${SQ_REDIS_ENABLED:-true}
      SQ_REDIS_URL: redis://:${SQ_REDIS_PASSWORD:-stockquant_redis_2024}@redis:6379/0
      SQ_CELERY_ENABLED: "true"
      SQ_CELERY_BROKER_URL: redis://:${SQ_REDIS_PASSWORD:-stockquant_redis_2024}@redis:6379/1
      SQ_DATABASE_URL: ${SQ_DATABASE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - celery

  # ====== Nginx 反向代理 ======
  nginx:
    image: nginx:alpine
    container_name: stock-quant-nginx
    profiles:
      - proxy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data: